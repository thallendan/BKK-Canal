<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangkok Water Gates & Stations Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background-color: #f4f6f9;
      color: #333;
    }

    /* Sidebar Styling */
    #sidebar {
      width: 360px;
      background: #ffffff;
      border-right: 1px solid #e1e4e8;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 2px 0 8px rgba(0,0,0,0.05);
    }

    .header {
      padding: 18px 20px;
      background: #1a365d;
      color: white;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.8rem;
      color: #cbd5e0;
    }

    .controls {
      padding: 12px 16px;
      background: #f7fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box {
      padding: 8px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }

    .search-box:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 2px rgba(49,130,206,0.2);
    }

    .file-input-wrapper {
      font-size: 0.75rem;
      color: #718096;
    }

    .station-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .station-item {
      padding: 12px 16px;
      border-bottom: 1px solid #edf2f7;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .station-item:hover {
      background-color: #ebf8ff;
    }

    .station-item.active {
      background-color: #ebf8ff;
      border-left: 4px solid #3182ce;
    }

    .station-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #2d3748;
    }

    .station-sub {
      font-size: 0.78rem;
      color: #718096;
      margin-top: 2px;
    }

    .level-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 6px;
      margin-right: 4px;
      background: #edf2f7;
      color: #4a5568;
    }

    /* Main Content / Map Area */
    #main {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      background-color: #e2e8f0;
    }

    /* Floating Info Card */
    #info-card {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 320px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      padding: 16px;
      z-index: 1000;
      display: none;
    }

    #info-card h3 {
      font-size: 1rem;
      color: #1a202c;
      margin-bottom: 2px;
    }

    #info-card .subtitle {
      font-size: 0.8rem;
      color: #718096;
      margin-bottom: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #e2e8f0;
      font-size: 0.85rem;
    }

    .info-label {
      color: #718096;
    }

    .info-val {
      font-weight: 600;
      color: #2d3748;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #a0aec0;
    }

    .close-btn:hover {
      color: #4a5568;
    }

    /* Custom Leaflet Marker Box */
    .gate-marker {
      background: #3182ce;
      border: 2px solid white;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      color: white;
      text-align: center;
      line-height: 20px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .gate-marker:hover {
      background: #2b6cb0;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="header">
      <h1>Bangkok Water Gates</h1>
      <p id="status-text">Bounding Box: [13.5860, 100.2305] to [13.9054, 100.9703]</p>
    </div>

    <div class="controls">
      <input type="text" id="search" class="search-box" placeholder="Search station name..." oninput="filterStations()" />
      <div class="file-input-wrapper">
        <span>If JSON doesn't auto-load, select file:</span><br>
        <input type="file" id="file-selector" accept=".json" onchange="loadFromFile(event)">
      </div>
    </div>

    <ul class="station-list" id="station-list">
      <!-- Station items will populate here -->
    </ul>
  </div>

  <!-- Map Container -->
  <div id="main">
    <div id="map"></div>

    <!-- Clicked Station Info Card -->
    <div id="info-card">
      <button class="close-btn" onclick="closeInfoCard()">&times;</button>
      <h3 id="card-title">Station Name</h3>
      <div id="card-sub" class="subtitle">English Name</div>

      <div class="info-row">
        <span class="info-label">Water Level In</span>
        <span class="info-val" id="card-in">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Water Level Out</span>
        <span class="info-val" id="card-out">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Last Updated In</span>
        <span class="info-val" id="card-time-in">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Last Updated Out</span>
        <span class="info-val" id="card-time-out">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Agency</span>
        <span class="info-val" id="card-agency">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Location</span>
        <span class="info-val" id="card-loc">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Coordinates</span>
        <span class="info-val" id="card-coords">-</span>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Bounding Box Corners
    const SW_CORNER = [13.5860, 100.2305];
    const NE_CORNER = [13.9054, 100.9703];
    const mapBounds = [SW_CORNER, NE_CORNER];

    // Initialize Leaflet Map
    const map = L.map('map', {
      maxBounds: mapBounds,
      maxBoundsViscosity: 0.8
    }).fitBounds(mapBounds);

    // Static Image Overlay with JPG fallback
    let imageOverlay = L.imageOverlay('bangkok_map.png', mapBounds).addTo(map);

    // Handle missing PNG by trying JPG
    const imgTester = new Image();
    imgTester.onerror = () => {
      map.removeLayer(imageOverlay);
      imageOverlay = L.imageOverlay('bangkok_map.jpg', mapBounds).addTo(map);
    };
    imgTester.src = 'bangkok_map.png';

    let allStations = [];
    let markersMap = new Map();

    // Geographic boundary filter
    function isWithinBounds(lat, lng) {
      return lat >= SW_CORNER[0] && lat <= NE_CORNER[0] &&
             lng >= SW_CORNER[1] && lng <= NE_CORNER[1];
    }

    // Process JSON data structure
    function processData(jsonData) {
      const dataList = jsonData.watergate_data?.data || jsonData.data || [];
      
      allStations = dataList.filter(item => {
        const lat = item.station?.tele_station_lat;
        const lng = item.station?.tele_station_long;
        return lat != null && lng != null && isWithinBounds(lat, lng);
      });

      document.getElementById('status-text').innerText = 
        `Found ${allStations.length} stations in Bangkok bounds`;

      renderMapMarkers();
      renderSidebarList(allStations);
    }

    // Create Markers on Map
    function renderMapMarkers() {
      // Clear existing markers
      markersMap.forEach(marker => map.removeLayer(marker));
      markersMap.clear();

      allStations.forEach((item, index) => {
        const lat = item.station.tele_station_lat;
        const lng = item.station.tele_station_long;
        const nameTh = item.station.tele_station_name?.th || 'N/A';
        const nameEn = item.station.tele_station_name?.en || '';

        // Custom box icon
        const customIcon = L.divIcon({
          className: 'gate-marker',
          html: `<div style="padding: 2px 4px; white-space: nowrap;">⚙️</div>`,
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        });

        const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
        
        marker.bindTooltip(`<b>${nameTh}</b><br>${nameEn}`, {
          direction: 'top',
          offset: [0, -10]
        });

        marker.on('click', () => {
          showInfoCard(item);
          highlightSidebarItem(index);
        });

        markersMap.set(index, marker);
      });
    }

    // Render Station List in Sidebar
    function renderSidebarList(stations) {
      const listContainer = document.getElementById('station-list');
      listContainer.innerHTML = '';

      if (stations.length === 0) {
        listContainer.innerHTML = '<li style="padding:16px; text-align:center; color:#a0aec0;">No stations found</li>';
        return;
      }

      stations.forEach((item, index) => {
        const nameTh = item.station.tele_station_name?.th || 'Station';
        const nameEn = item.station.tele_station_name?.en || '';
        const wIn = item.watergate_in != null ? `${item.watergate_in} m` : 'N/A';
        const wOut = item.watergate_out != null ? `${item.watergate_out} m` : 'N/A';

        const li = document.createElement('li');
        li.className = 'station-item';
        li.id = `station-item-${index}`;
        li.innerHTML = `
          <div class="station-title">${nameTh}</div>
          <div class="station-sub">${nameEn}</div>
          <div>
            <span class="level-badge">IN: ${wIn}</span>
            <span class="level-badge">OUT: ${wOut}</span>
          </div>
        `;

        li.onclick = () => {
          const lat = item.station.tele_station_lat;
          const lng = item.station.tele_station_long;
          map.setView([lat, lng], map.getZoom() > 12 ? map.getZoom() : 13);
          showInfoCard(item);
          highlightSidebarItem(index);
        };

        listContainer.appendChild(li);
      });
    }

    // Display Info Card on Click
    function showInfoCard(item) {
      const st = item.station || {};
      const gc = item.geocode || {};
      const ag = item.agency?.agency_shortname?.en || item.agency?.agency_name?.en || 'N/A';

      document.getElementById('card-title').innerText = st.tele_station_name?.th || 'N/A';
      document.getElementById('card-sub').innerText = st.tele_station_name?.en || '';
      
      document.getElementById('card-in').innerText = item.watergate_in != null ? `${item.watergate_in} m MSL` : 'N/A';
      document.getElementById('card-out').innerText = item.watergate_out != null ? `${item.watergate_out} m MSL` : 'N/A';
      
      document.getElementById('card-time-in').innerText = item.watergate_datetime_in || 'N/A';
      document.getElementById('card-time-out').innerText = item.watergate_datetime_out || 'N/A';
      
      document.getElementById('card-agency').innerText = ag;
      document.getElementById('card-loc').innerText = 
        [gc.tumbon_name?.en, gc.amphoe_name?.en, gc.province_name?.en].filter(Boolean).join(', ') || 'N/A';
      
      document.getElementById('card-coords').innerText = `${st.tele_station_lat?.toFixed(5)}, ${st.tele_station_long?.toFixed(5)}`;

      document.getElementById('info-card').style.display = 'block';
    }

    function closeInfoCard() {
      document.getElementById('info-card').style.display = 'none';
    }

    function highlightSidebarItem(index) {
      document.querySelectorAll('.station-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`station-item-${index}`);
      if (activeEl) {
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // Filter stations via search bar
    function filterStations() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = allStations.filter(item => {
        const th = (item.station.tele_station_name?.th || '').toLowerCase();
        const en = (item.station.tele_station_name?.en || '').toLowerCase();
        return th.includes(q) || en.includes(q);
      });
      renderSidebarList(filtered);
    }

    // Auto-fetch data file
    function initDataFetch() {
      fetch('watergate_load_2.json')
        .then(res => res.json())
        .then(data => processData(data))
        .catch(err => {
          console.warn('Could not auto-fetch watergate_load_2.json, trying watergate_load.json:', err);
          fetch('watergate_load.json')
            .then(res => res.json())
            .then(data => processData(data))
            .catch(e => console.log('Waiting for manual file upload if opened via local file protocol.'));
        });
    }

    // Manual File Upload Handler (For local file:// browsing without web server)
    function loadFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const json = JSON.parse(e.target.result);
          processData(json);
        } catch (err) {
          alert('Invalid JSON file format.');
        }
      };
      reader.readAsText(file);
    }

    // Start fetching data on page load
    window.onload = initDataFetch;
  </script>
</body>
</html>
