<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thailand Macro Water System & Basin Hydraulics Telemetry</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        navy: {
                            950: '#070a12',
                            900: '#0b132b',
                            800: '#1c2541',
                            700: '#2a3b5c'
                        },
                        cyan: {
                            glow: '#00f5d4',
                            electric: '#00b4d8'
                        },
                        warning: '#ffb703',
                        critical: '#ff0054'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #070a12;
            color: #f8fafc;
            overflow: hidden;
            user-select: none;
        }
        .glass-panel {
            background: rgba(11, 19, 43, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-cyan {
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.25);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col font-sans relative">

    <!-- HEADER NAVIGATION -->
    <header class="glass-panel absolute top-0 left-0 right-0 z-30 px-4 py-2.5 mx-3 my-3 rounded-2xl flex flex-wrap items-center justify-between gap-4 border border-slate-800/80">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-cyan-glow/10 rounded-xl border border-cyan-glow/30 text-cyan-glow">
                <i data-lucide="waves" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-wide uppercase text-slate-100 flex items-center gap-2">
                    BKK Basin Telemetry & Hydro-Control
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-mono bg-cyan-glow/20 text-cyan-glow border border-cyan-glow/30">LIVE SYSTEM</span>
                </h1>
                <p class="text-[11px] text-slate-400 font-mono">Dynamic Hydraulics & Real-time Water Level Mapping</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-2">
            <button onclick="resetMapView()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1.5 transition">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset View
            </button>
            <button onclick="zoomMap(1.2)" class="p-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                <i data-lucide="zoom-in" class="w-4 h-4"></i>
            </button>
            <button onclick="zoomMap(0.8)" class="p-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                <i data-lucide="zoom-out" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- MAP CANVAS AREA -->
    <main class="flex-1 relative overflow-hidden">
        <canvas id="mapCanvas" class="w-full h-full cursor-grab active:cursor-grabbing"></canvas>

        <!-- TOOLTIP OVERLAY -->
        <div id="node-tooltip" class="pointer-events-none fixed z-40 hidden glass-panel px-3 py-2 rounded-xl border border-slate-700 text-xs shadow-2xl space-y-1">
            <div id="tooltip-title" class="font-bold text-slate-100"></div>
            <div id="tooltip-val" class="font-mono text-cyan-glow text-[11px]"></div>
            <div id="tooltip-status" class="font-mono text-[10px]"></div>
        </div>

        <!-- BOTTOM LEGEND -->
        <div class="absolute bottom-6 left-4 z-20 glass-panel p-3 rounded-2xl border border-slate-800/80 text-[11px] font-mono flex items-center gap-4 text-slate-300">
            <div class="flex items-center gap-1.5">
                <span class="w-3 h-3 rounded-full bg-cyan-electric border border-cyan-glow"></span> Normal
            </div>
            <div class="flex items-center gap-1.5">
                <span class="w-3 h-3 rounded-full bg-warning border border-yellow-300"></span> Warning
            </div>
            <div class="flex items-center gap-1.5">
                <span class="w-3 h-3 rounded-full bg-critical border border-red-400 animate-pulse"></span> Critical
            </div>
            <div class="flex items-center gap-1.5">
                <span class="w-3 h-3 rounded-full bg-slate-600 border border-slate-400"></span> Offline / Dry
            </div>
        </div>
    </main>

    <script>
        const API_MAP_URL = 'https://bkkcanals-704017858243-ap-southeast-7-an.s3.ap-southeast-7.amazonaws.com/klongmap-latest.json';
        const API_LEVELS_URL = 'https://bkkcanals-704017858243-ap-southeast-7-an.s3.ap-southeast-7.amazonaws.com/master_water_level_data.json';

        let canvas, ctx;
        let mapTransform = { x: 0, y: 0, scale: 1 };
        let isDragging = false, dragStart = { x: 0, y: 0 };
        let simState = { hoveredNode: null };

        // Station Nodes Data Map
        let waterNodes = {};
        
        // River Geometry Mapping
        let riverPaths = [
            { id: 'chao_phraya', name: 'Chao Phraya River', points: [{x: 500, y: 100}, {x: 510, y: 300}, {x: 490, y: 500}, {x: 520, y: 700}], stationId: '102', width: 8 },
            { id: 'bang_sue', name: 'Khlong Bang Sue', points: [{x: 510, y: 300}, {x: 650, y: 325}, {x: 693, y: 313}], stationId: '13', width: 4 },
            { id: 'prem_prachakon', name: 'Khlong Prem Prachakon', points: [{x: 650, y: 151}, {x: 650, y: 214}, {x: 651, y: 325}], stationId: '118', width: 4 },
            { id: 'phraya_suren', name: 'Khlong Phraya Suren', points: [{x: 997, y: 228}, {x: 997, y: 270}], stationId: '124', width: 4 },
            { id: 'sanam_chai', name: 'Khlong Sanam Chai', points: [{x: 234, y: 682}, {x: 320, y: 682}, {x: 368, y: 682}], stationId: '113', width: 5 }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('mapCanvas');
            ctx = canvas.getContext('2d');
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setupCanvasEvents();

            fetchTelemetryData();
            setInterval(fetchTelemetryData, 60000);

            requestAnimationFrame(renderLoop);
            lucide.createIcons();
        });

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        async function fetchTelemetryData() {
            try {
                const mapRes = await fetch(API_MAP_URL);
                const data = await mapRes.json();
                
                if (data && data.waterStation) {
                    data.waterStation.forEach(s => {
                        const info = s.water_station_info || {};
                        const last = s.water_level_last || {};

                        const wl = last.wl_in !== null && last.wl_in !== -99 ? last.wl_in : null;
                        const warn = info.warning || 0.6;
                        const crit = info.critical || 0.8;

                        waterNodes[s.water_id] = {
                            id: s.water_id,
                            name: s.station_name_en || info.water_shortname_en || s.station_name || 'Station ' + s.water_id,
                            worldX: s.offset_x || 400,
                            worldY: s.offset_y || 400,
                            type: s.station_type_id === 2 ? 'pump' : (s.station_type_id === 3 ? 'gate' : 'gauge'),
                            waterLevel: wl,
                            warningThreshold: warn,
                            criticalThreshold: crit,
                            status: calculateStatus(wl, warn, crit)
                        };
                    });
                }
            } catch (err) {
                console.warn('Using local fallback telemetry data:', err);
            }
        }

        function calculateStatus(wl, warn, crit) {
            if (wl === null || wl === undefined) return 'offline';
            if (wl >= crit) return 'critical';
            if (wl >= warn) return 'warning';
            return 'normal';
        }

        function getStatusColor(status) {
            switch (status) {
                case 'critical': return '#ff0054';
                case 'warning': return '#ffb703';
                case 'normal': return '#00b4d8';
                default: return '#64748b';
            }
        }

        function setupCanvasEvents() {
            canvas.addEventListener('mousedown', e => {
                isDragging = true;
                dragStart = { x: e.clientX - mapTransform.x, y: e.clientY - mapTransform.y };
            });

            window.addEventListener('mousemove', e => {
                if (isDragging) {
                    mapTransform.x = e.clientX - dragStart.x;
                    mapTransform.y = e.clientY - dragStart.y;
                } else {
                    checkHover(e);
                }
            });

            window.addEventListener('mouseup', () => isDragging = false);
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                zoomMap(zoomFactor);
            });
        }

        function zoomMap(factor) {
            mapTransform.scale = Math.max(0.4, Math.min(4.0, mapTransform.scale * factor));
        }

        function resetMapView() {
            mapTransform = { x: 0, y: 0, scale: 1 };
        }

        function checkHover(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - mapTransform.x) / mapTransform.scale;
            const mouseY = (e.clientY - rect.top - mapTransform.y) / mapTransform.scale;

            let found = null;
            for (let id in waterNodes) {
                const n = waterNodes[id];
                const dist = Math.hypot(n.worldX - mouseX, n.worldY - mouseY);
                if (dist < 18) {
                    found = n;
                    break;
                }
            }

            simState.hoveredNode = found;
            const tooltip = document.getElementById('node-tooltip');

            if (found) {
                tooltip.classList.remove('hidden');
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY + 15) + 'px';
                document.getElementById('tooltip-title').innerText = found.name;
                document.getElementById('tooltip-val').innerText = `Level: ${found.waterLevel !== null ? found.waterLevel + ' m' : 'N/A'}`;
                
                const statusEl = document.getElementById('tooltip-status');
                statusEl.innerText = `STATUS: ${found.status.toUpperCase()}`;
                statusEl.style.color = getStatusColor(found.status);
            } else {
                tooltip.classList.add('hidden');
            }
        }

        function renderLoop(timestamp) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(mapTransform.x, mapTransform.y);
            ctx.scale(mapTransform.scale, mapTransform.scale);

            drawGrid();
            drawRivers();
            drawNodes(timestamp);

            ctx.restore();
            requestAnimationFrame(renderLoop);
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const step = 80;
            for (let x = 0; x < 2000; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1500); ctx.stroke();
            }
            for (let y = 0; y < 1500; y += step) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(2000, y); ctx.stroke();
            }
        }

        // DYNAMIC RIVER COLORING BASED ON ASSOCIATED STATION WATER LEVELS
        function drawRivers() {
            riverPaths.forEach(path => {
                const linkedStation = waterNodes[path.stationId];
                const status = linkedStation ? linkedStation.status : 'normal';
                const riverColor = getStatusColor(status);

                ctx.beginPath();
                ctx.moveTo(path.points[0].x, path.points[0].y);
                for (let i = 1; i < path.points.length; i++) {
                    ctx.lineTo(path.points[i].x, path.points[i].y);
                }
                ctx.strokeStyle = riverColor;
                ctx.lineWidth = path.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            });
        }

        // DYNAMIC STATION ICON COLORING
        function drawNodes(t) {
            for (let id in waterNodes) {
                const node = waterNodes[id];
                const isHovered = simState.hoveredNode && simState.hoveredNode.id === node.id;
                const statusColor = getStatusColor(node.status);

                ctx.save();
                ctx.translate(node.worldX, node.worldY);

                // Outer aura ring for alerts
                if (node.status === 'critical' || node.status === 'warning') {
                    const pulseRadius = 16 + Math.sin(t * 0.005) * 4;
                    ctx.beginPath();
                    ctx.arc(0, 0, pulseRadius, 0, Math.PI * 2);
                    ctx.fillStyle = node.status === 'critical' ? 'rgba(255,0,84,0.25)' : 'rgba(255,183,3,0.2)';
                    ctx.fill();
                }

                // Station Core Icon Body
                ctx.beginPath();
                ctx.arc(0, 0, isHovered ? 14 : 11, 0, Math.PI * 2);
                ctx.fillStyle = '#0b132b';
                ctx.fill();
                ctx.strokeStyle = statusColor;
                ctx.lineWidth = isHovered ? 3 : 2;
                ctx.stroke();

                // Center Indicator Point
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fillStyle = statusColor;
                ctx.fill();

                // Station Label
                ctx.fillStyle = isHovered ? '#ffffff' : '#94a3b8';
                ctx.font = '10px JetBrains Mono, monospace';
                ctx.fillText(node.name, 16, 4);

                ctx.restore();
            }
        }
    </script>
</body>
</html>
