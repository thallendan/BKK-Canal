<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroView - Real-Time Hydrological Monitoring System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        canvas { touch-action: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 3px; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 text-slate-100">

    <!-- Header Navigation -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/80 backdrop-blur px-4 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="h-8 w-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">
                HV
            </div>
            <div>
                <h1 class="text-sm font-bold leading-none text-slate-100">HydroView Engine</h1>
                <p class="text-[10px] text-slate-400 mt-0.5">Standardized Hydrological Risk & Telemetry Dashboard</p>
            </div>
        </div>

        <!-- Legend Bar -->
        <div class="hidden md:flex items-center gap-4 bg-slate-950/60 border border-slate-800/80 px-3 py-1 rounded-full text-xs">
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-[#2196F3]"></span>
                <span class="text-slate-300">Low Water</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-[#4CAF50]"></span>
                <span class="text-slate-300">Normal</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-[#FF9800]"></span>
                <span class="text-slate-300">Warning</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-[#F44336]"></span>
                <span class="text-slate-300">Danger / Critical</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-[#9E9E9E]"></span>
                <span class="text-slate-400">Offline</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Canvas Map Area -->
        <div class="flex-1 relative bg-slate-950 overflow-hidden">
            <canvas id="mapCanvas" class="w-full h-full cursor-grab active:cursor-grabbing block"></canvas>
            
            <!-- Map Overlay Controls -->
            <div class="absolute bottom-4 left-4 flex flex-col gap-2 bg-slate-900/90 border border-slate-800 p-1.5 rounded-lg shadow-xl backdrop-blur">
                <button id="zoomInBtn" class="w-8 h-8 flex items-center justify-center hover:bg-slate-800 rounded font-bold text-slate-200 transition">+</button>
                <button id="zoomOutBtn" class="w-8 h-8 flex items-center justify-center hover:bg-slate-800 rounded font-bold text-slate-200 transition">-</button>
                <button id="resetViewBtn" class="w-8 h-8 flex items-center justify-center hover:bg-slate-800 rounded text-xs text-slate-300 transition">Reset</button>
            </div>
        </div>

        <!-- Sidebar Inspector Panel -->
        <aside class="w-80 border-l border-slate-800 bg-slate-900/90 backdrop-blur flex flex-col overflow-hidden shrink-0">
            <div class="p-3 border-b border-slate-800 bg-slate-900">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Station Inspector</h2>
            </div>
            
            <div id="inspectorContent" class="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-4">
                <div class="text-center py-12 text-slate-500 text-xs">
                    Hover or click a station or river reach to inspect telemetry data and derived hydrological metrics.
                </div>
            </div>
        </aside>
    </div>

    <!-- Application Script -->
    <script>
        // =========================================================================
        // STANDARDIZED COLOR ENGINE & HYDROLOGICAL METRICS
        // =========================================================================

        const WATER_COLORS = {
            LOW: '#2196F3',      // Blue
            MEDIUM: '#4CAF50',   // Green
            WARNING: '#FF9800',  // Orange
            DANGER: '#F44336',   // Red
            OFFLINE: '#9E9E9E'   // Gray
        };

        function getWaterStatus(node) {
            if (!node || node.stage === null || node.stage === undefined || node.stage === -99) {
                return { color: WATER_COLORS.OFFLINE, label: 'OFFLINE / NO SIGNAL', badgeClass: 'bg-slate-800 text-slate-400 border border-slate-700' };
            }

            const wl = node.stage;
            const warn = node.warningLevel;
            const crit = node.criticalLevel;
            const dry = node.dryIn;

            if (node.type === 'dam' && node.pctFull !== undefined && node.pctFull !== null) {
                if (node.pctFull >= 90) return { color: WATER_COLORS.DANGER, label: 'CRITICAL CAPACITY', badgeClass: 'bg-red-500/20 text-red-400 border border-red-500/30' };
                if (node.pctFull >= 80) return { color: WATER_COLORS.WARNING, label: 'HIGH STORAGE', badgeClass: 'bg-amber-500/20 text-amber-400 border border-amber-500/30' };
                if (node.pctFull >= 50) return { color: WATER_COLORS.MEDIUM, label: 'NORMAL STORAGE', badgeClass: 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' };
                return { color: WATER_COLORS.LOW, label: 'LOW STORAGE', badgeClass: 'bg-blue-500/20 text-blue-400 border border-blue-500/30' };
            }

            if (crit !== null && crit !== undefined && wl >= crit) {
                return { color: WATER_COLORS.DANGER, label: 'CRITICAL / DANGER', badgeClass: 'bg-red-500/20 text-red-400 border border-red-500/30' };
            }
            if (warn !== null && warn !== undefined && wl >= warn) {
                return { color: WATER_COLORS.WARNING, label: 'WARNING LEVEL', badgeClass: 'bg-amber-500/20 text-amber-400 border border-amber-500/30' };
            }
            if (dry !== null && dry !== undefined && wl <= dry) {
                return { color: WATER_COLORS.LOW, label: 'LOW WATER', badgeClass: 'bg-blue-500/20 text-blue-400 border border-blue-500/30' };
            }

            return { color: WATER_COLORS.MEDIUM, label: 'MEDIUM / NORMAL', badgeClass: 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' };
        }

        function calculateHydrologicalMetrics(node) {
            const wl = node.stage !== undefined ? node.stage : node.wlIn;
            const bed = node.bedBank;
            const bank = (node.leftBank !== null && node.leftBank !== undefined) 
                ? Math.min(node.leftBank, node.rightBank !== null && node.rightBank !== undefined ? node.rightBank : node.leftBank) 
                : null;
            const crit = node.criticalLevel;

            // 1. Water Depth Saturation Ratio (Sd)
            let saturationRatio = null;
            if (wl !== null && wl !== undefined && bed !== null && bed !== undefined && bank !== null && bank !== undefined && bank > bed) {
                saturationRatio = ((wl - bed) / (bank - bed)) * 100;
            }

            // 2. Pumping Duty Load Ratio (Lp)
            let pumpLoadRatio = null;
            if (node.pumpTotal && node.pumpTotal > 0) {
                const active = node.pumpOn || 0;
                pumpLoadRatio = (active / node.pumpTotal) * 100;
            }

            // 3. Warning / Critical Proximity Index (Iprox)
            let proximityIndex = null;
            if (wl !== null && wl !== undefined && bed !== null && bed !== undefined && crit !== null && crit !== undefined && crit > bed) {
                proximityIndex = ((wl - bed) / (crit - bed)) * 100;
            }

            return { saturationRatio, pumpLoadRatio, proximityIndex };
        }

        // =========================================================================
        // SAMPLE TELEMETRY DATA (STRICTLY MAPS TO JSON SCHEMAS)
        // =========================================================================

        const riverPaths = [
            { id: 'ping', name: 'Ping River', color: WATER_COLORS.MEDIUM, points: [{x: 150, y: 50}, {x: 180, y: 150}, {x: 220, y: 220}] },
            { id: 'nan', name: 'Nan River', color: WATER_COLORS.WARNING, points: [{x: 350, y: 50}, {x: 310, y: 150}, {x: 220, y: 220}] },
            { id: 'pasak', name: 'Pasak River', color: WATER_COLORS.DANGER, points: [{x: 420, y: 180}, {x: 320, y: 250}, {x: 240, y: 310}] },
            { id: 'chaophraya_upper', name: 'Upper Chao Phraya River', color: WATER_COLORS.MEDIUM, points: [{x: 220, y: 220}, {x: 230, y: 300}, {x: 240, y: 380}] },
            { id: 'chaophraya_lower', name: 'Lower Chao Phraya (BMA Loop)', color: WATER_COLORS.MEDIUM, points: [{x: 240, y: 380}, {x: 250, y: 460}, {x: 230, y: 540}] }
        ];

        const stationNodes = [
            {
                id: '106',
                name: 'Khlong Phraya Ratchamontri Pumping Station',
                nameThai: 'ส.คลองพระยาราชมนตรี',
                type: 'pump',
                worldX: 180,
                worldY: 480,
                stage: -0.68,
                bedBank: -3.54,
                leftBank: 1.20,
                rightBank: 1.20,
                warningLevel: 0.40,
                criticalLevel: 0.50,
                dryIn: -2.00,
                pumpOn: 2,
                pumpTotal: 10
            },
            {
                id: '113',
                name: 'Khlong Sanam Chai Pumping Station',
                nameThai: 'ส.คลองสนามชัย',
                type: 'pump',
                worldX: 210,
                worldY: 520,
                stage: -0.28,
                bedBank: -1.27,
                leftBank: 1.25,
                rightBank: 1.25,
                warningLevel: 0.40,
                criticalLevel: 0.50,
                dryIn: -1.00,
                pumpOn: 3,
                pumpTotal: 15
            },
            {
                id: '132',
                name: 'Khlong Lam Pla Thio (Sangkhasantisuk)',
                nameThai: 'ค.ลำปลาทิว ถ.สังฆสันติสุข',
                type: 'gauge',
                worldX: 380,
                worldY: 420,
                stage: 0.94,
                bedBank: -2.09,
                leftBank: 2.00,
                rightBank: 2.00,
                warningLevel: 0.90,
                criticalLevel: 1.10,
                dryIn: -0.50,
                pumpOn: 0,
                pumpTotal: 0
            },
            {
                id: '108',
                name: 'Khun Si Buri Rak Water Gate',
                nameThai: 'ปตร.ขุนศรีฯ-ค.มหาสวัสดิ์',
                type: 'gate',
                worldX: 160,
                worldY: 390,
                stage: 0.59,
                bedBank: -2.00,
                leftBank: 1.98,
                rightBank: 1.98,
                warningLevel: 1.80,
                criticalLevel: 2.00,
                dryIn: -1.00,
                pumpOn: 0,
                pumpTotal: 0
            },
            {
                id: 'bhumibol',
                name: 'Bhumibol Dam',
                nameThai: 'เขื่อนภูมิพล',
                type: 'dam',
                worldX: 150,
                worldY: 50,
                stage: 240.50,
                pctFull: 70.8,
                warningLevel: null,
                criticalLevel: null,
                bedBank: null,
                leftBank: null
            },
            {
                id: 'pasak_dam',
                name: 'Pasak Jolasid Dam',
                nameThai: 'เขื่อนป่าสักชลสิทธิ์',
                type: 'dam',
                worldX: 420,
                worldY: 180,
                stage: 42.10,
                pctFull: 92.4,
                warningLevel: null,
                criticalLevel: null,
                bedBank: null,
                leftBank: null
            },
            {
                id: '123',
                name: 'Khlong Bang Talat (Tha Sai)',
                nameThai: 'ค.บางตลาด-ท่าทราย',
                type: 'gauge',
                worldX: 270,
                worldY: 340,
                stage: -99, // Offline indicator
                bedBank: -1.40,
                leftBank: 1.62,
                warningLevel: 0.70,
                criticalLevel: 0.80
            }
        ];

        // =========================================================================
        // CANVAS & INTERACTIVE RENDERING ENGINE
        // =========================================================================

        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const inspectorEl = document.getElementById('inspectorContent');

        let zoom = 1.3;
        let panX = 40;
        let panY = 20;
        let isDragging = false;
        let startX, startY;
        let hoveredNode = null;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            draw();
        }

        window.addEventListener('resize', resizeCanvas);

        function drawRiverPaths(ctx) {
            riverPaths.forEach(path => {
                ctx.beginPath();
                if (path.points && path.points.length > 0) {
                    ctx.moveTo(path.points[0].x, path.points[0].y);
                    for (let i = 1; i < path.points.length; i++) {
                        ctx.lineTo(path.points[i].x, path.points[i].y);
                    }
                }
                ctx.strokeStyle = path.color;
                ctx.lineWidth = 6 / zoom;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            });
        }

        function drawDamNode(ctx, node, isHovered) {
            const status = getWaterStatus(node);
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = isHovered ? '#ffffff' : status.color;
            ctx.lineWidth = (isHovered ? 3 : 2) / zoom;

            ctx.beginPath();
            ctx.arc(node.worldX, node.worldY, 14 / zoom, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = status.color;
            ctx.beginPath();
            ctx.arc(node.worldX, node.worldY, 8 / zoom, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGateNode(ctx, node, isHovered) {
            const status = getWaterStatus(node);
            const size = 18 / zoom;
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = isHovered ? '#ffffff' : status.color;
            ctx.lineWidth = (isHovered ? 3 : 2) / zoom;

            ctx.beginPath();
            ctx.rect(node.worldX - size/2, node.worldY - size/2, size, size);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = status.color;
            ctx.fillRect(node.worldX - size/4, node.worldY - size/4, size/2, size/2);
        }

        function drawPumpNode(ctx, node, isHovered) {
            const status = getWaterStatus(node);
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = isHovered ? '#ffffff' : status.color;
            ctx.lineWidth = (isHovered ? 3 : 2) / zoom;

            ctx.beginPath();
            ctx.arc(node.worldX, node.worldY, 12 / zoom, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = status.color;
            ctx.beginPath();
            ctx.arc(node.worldX, node.worldY, 6 / zoom, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGaugeNode(ctx, node, isHovered) {
            const status = getWaterStatus(node);
            ctx.fillStyle = status.color;
            ctx.strokeStyle = isHovered ? '#ffffff' : '#020617';
            ctx.lineWidth = 2 / zoom;

            ctx.beginPath();
            ctx.arc(node.worldX, node.worldY, 8 / zoom, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }

        function draw() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid lines background
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 0.5;
            const gridSize = 40 * zoom;
            for (let x = panX % gridSize; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = panY % gridSize; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            ctx.translate(panX, panY);
            ctx.scale(zoom, zoom);

            // Render rivers & channels
            drawRiverPaths(ctx);

            // Render station nodes
            stationNodes.forEach(node => {
                const isHovered = hoveredNode === node;
                if (node.type === 'dam') drawDamNode(ctx, node, isHovered);
                else if (node.type === 'gate') drawGateNode(ctx, node, isHovered);
                else if (node.type === 'pump') drawPumpNode(ctx, node, isHovered);
                else drawGaugeNode(ctx, node, isHovered);
            });

            ctx.restore();
        }

        // =========================================================================
        // INSPECTOR SIDEBAR RENDERER
        // =========================================================================

        function updateInspector(node) {
            if (!node) {
                inspectorEl.innerHTML = `
                    <div class="text-center py-12 text-slate-500 text-xs">
                        Hover or click a station or river reach to inspect telemetry data and derived hydrological metrics.
                    </div>
                `;
                return;
            }

            const status = getWaterStatus(node);
            const metrics = calculateHydrologicalMetrics(node);

            inspectorEl.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Station ID: #${node.id}</span>
                        <h3 class="text-base font-bold text-slate-100 leading-tight mt-0.5">${node.name}</h3>
                        ${node.nameThai ? `<p class="text-xs text-slate-400 mt-0.5 font-sans">${node.nameThai}</p>` : ''}
                    </div>

                    <div class="p-3 bg-slate-950/60 border border-slate-800 rounded-lg">
                        <div class="flex justify-between items-center mb-1.5">
                            <span class="text-xs text-slate-400 font-medium">Water Level Status</span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${status.badgeClass}">${status.label}</span>
                        </div>
                        <div class="text-2xl font-mono font-bold" style="color: ${status.color}">
                            ${node.stage !== null && node.stage !== undefined && node.stage !== -99 ? node.stage.toFixed(2) + ' m MSL' : 'N/A'}
                        </div>
                    </div>

                    <div class="p-3 bg-slate-950/60 border border-slate-800 rounded-lg space-y-2.5">
                        <span class="text-[11px] font-bold text-blue-400 uppercase tracking-wider block border-b border-slate-800 pb-1">Derived Hydrological Metrics</span>
                        
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-400">Water Depth Saturation ($S_d$):</span>
                            <span class="font-mono font-bold text-slate-200">
                                ${metrics.saturationRatio !== null ? metrics.saturationRatio.toFixed(1) + '%' : 'N/A'}
                            </span>
                        </div>

                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-400">Critical Proximity Index ($I_{prox}$):</span>
                            <span class="font-mono font-bold text-amber-400">
                                ${metrics.proximityIndex !== null ? metrics.proximityIndex.toFixed(1) + '%' : 'N/A'}
                            </span>
                        </div>

                        ${metrics.pumpLoadRatio !== null ? `
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-400">Pumping Duty Load ($L_p$):</span>
                            <span class="font-mono font-bold text-emerald-400">
                                ${metrics.pumpLoadRatio.toFixed(1)}% (${node.pumpOn}/${node.pumpTotal} Active)
                            </span>
                        </div>
                        ` : ''}
                    </div>

                    <div class="p-3 bg-slate-950/60 border border-slate-800 rounded-lg space-y-2 text-xs">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block border-b border-slate-800 pb-1">Telemetry Thresholds</span>
                        
                        <div class="flex justify-between">
                            <span class="text-slate-400">Canal Bed Level:</span>
                            <span class="font-mono text-slate-300">${node.bedBank !== null && node.bedBank !== undefined ? node.bedBank.toFixed(2) + ' m MSL' : 'N/A'}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">Bank Level:</span>
                            <span class="font-mono text-slate-300">${node.leftBank !== null && node.leftBank !== undefined ? node.leftBank.toFixed(2) + ' m MSL' : 'N/A'}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">Warning Threshold:</span>
                            <span class="font-mono text-amber-400">${node.warningLevel !== null && node.warningLevel !== undefined ? node.warningLevel.toFixed(2) + ' m MSL' : 'N/A'}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">Critical Threshold:</span>
                            <span class="font-mono text-red-400">${node.criticalLevel !== null && node.criticalLevel !== undefined ? node.criticalLevel.toFixed(2) + ' m MSL' : 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // =========================================================================
        // INTERACTION & PAN/ZOOM EVENT LISTENERS
        // =========================================================================

        function getMouseWorldCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX - rect.left;
            const clientY = e.clientY - rect.top;
            return {
                x: (clientX - panX) / zoom,
                y: (clientY - panY) / zoom
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                draw();
                return;
            }

            const coords = getMouseWorldCoords(e);
            let found = null;

            for (const node of stationNodes) {
                const dx = coords.x - node.worldX;
                const dy = coords.y - node.worldY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 15 / zoom) {
                    found = node;
                    break;
                }
            }

            if (found !== hoveredNode) {
                hoveredNode = found;
                draw();
                updateInspector(hoveredNode);
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            panX = mouseX - (mouseX - panX) * zoomFactor;
            panY = mouseY - (mouseY - panY) * zoomFactor;
            zoom *= zoomFactor;
            zoom = Math.min(Math.max(zoom, 0.5), 5.0);

            draw();
        });

        document.getElementById('zoomInBtn').addEventListener('click', () => { zoom *= 1.2; draw(); });
        document.getElementById('zoomOutBtn').addEventListener('click', () => { zoom /= 1.2; draw(); });
        document.getElementById('resetViewBtn').addEventListener('click', () => { zoom = 1.3; panX = 40; panY = 20; draw(); });

        // Initialize Canvas
        resizeCanvas();
    </script>
</body>
</html>
