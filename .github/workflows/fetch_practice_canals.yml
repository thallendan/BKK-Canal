name: Fetch Practice Canals Data

on:
  schedule:
    # Runs every hour at the top of the hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-canals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch live canal water level data
        run: python fetch_practice_canals.py

      - name: Commit and push updated JSON dump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data_practice_canals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update practice canals water level data dump" && git push)
