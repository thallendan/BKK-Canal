name: Fetch ThaiWater Water Levels Data

on:
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch script
        run: python fetch_waterlevel.py

      - name: Commit and push updated waterlevel.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update: waterlevel.json"
          file_pattern: "waterlevel.json"
