name: Run Practice Fetch Script

on:
  workflow_dispatch: # Enables the manual "Run workflow" button in GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Practice Script
        env:
          STORMGLASS_API_KEY: ${{ secrets.STORMGLASS_API_KEY }}
        run: python fetch_practice.py

      - name: Commit and push generated data_practice.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_practice.json
          git commit -m "Auto-update data_practice.json via manual trigger" || echo "No changes to commit"
          git push
