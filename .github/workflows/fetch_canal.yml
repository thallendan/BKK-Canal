name: Fetch Bangkok & Samut Prakan Canal Data

on:
  workflow_dispatch:        # Allows manual triggering from GitHub UI

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Fetch Script
        run: python fetch_practice_canal.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bkk_samutprakan_canals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update BKK & Samut Prakan canal water levels" && git push)
