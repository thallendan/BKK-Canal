name: Fetch Macro Hydrological Data

on:
  schedule:
    # Runs hourly at 20 minutes past the hour
    - cron: '20 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  fetch-macro-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Macro Telemetry Script
        run: python fetch_macro.py

      - name: Commit and Push Updated Macro Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -f "macro_data.json" ]; then
            git add macro_data.json
            
            if git diff --staged --quiet; then
              echo "No changes detected in macro_data.json."
            else
              git commit -m "auto: update macro hydrological data [skip ci]"
              git push
            fi
          else
            echo "Error: macro_data.json was not generated by fetch_macro.py"
            exit 1
          fi
