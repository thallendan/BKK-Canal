name: Fetch Practice KhlongMap Telemetry

on:
  workflow_dispatch: # Allows manual run button in GitHub Actions UI

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permissions to commit updated JSON back to main

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run KhlongMap Fetch Script
        run: python fetch_practice_khlongmap.py

      - name: Commit and Push Updated Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_practice_khlongmap.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: data_practice_khlongmap.json [skip ci]" && git push)
