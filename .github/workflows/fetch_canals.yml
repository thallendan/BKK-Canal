name: Fetch BMA Canals Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-canals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run canal telemetry fetcher
        run: python fetch_canals.py

      - name: Commit and push updated canals.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: update BMA canal telemetry [skip ci]"
          file_pattern: "canals.json"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
