name: Fetch Master Water Level

on:
workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
run-fetch-script:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'
      cache: 'pip' # Optional caching for faster dependency installation

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  - name: Run fetch_master_water_level.py
    run: python fetch_master_water_level.py

  - name: Commit and push changes
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git add -A
      git diff --staged --quiet || (git commit -m "Automated update: fetch master water level data" && git push)
