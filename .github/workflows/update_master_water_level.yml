name: Update Master Water Level Data

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:          # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: master-water-level
  cancel-in-progress: false

jobs:
  run-fetch-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute master water level fetch script
        env:
          SAVE_RAW: "1"
        run: python fetch_master_water_level.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master_water_level_data.json
          for f in *_raw.html estuary_raw.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || (git commit -m "auto: update master_water_level_data.json" && git pull --rebase && git push)
